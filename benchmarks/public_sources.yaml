coverage:
  counterflow: "Only bicycles / e-bikes on fixed CCTV (wrong_way_cycling) and Roboflow wrong-way pictures. No public CAR wrong-way clips found (the AI City 2020 Iowa DOT clips have no public download). htv_highway gives normal-flow negatives."
  illegal_parking: "ATG-PVD (drone, not CCTV; its download link is dead since 2026-10-29: ask the authors). The i-LIDS Parked Vehicle (AVSS) and the Sussex traffic sets are used by papers, but I could not confirm a free download."
  restricted_lane: "Nothing found: film your own. Added 2026-11-03: the zone-rules substrates (nancy_multiperspective, avdl_latvia, road_anomaly_cctv): fixed views, events not labelled."
  pedestrian_lane: "idiap_traffic_junction (a car entering the pedestrian area, people off the zebra) and medellin_pedestrian_cctv (crosswalk frames). A 'Crosswalk' video set was seen listed but could not be verified."
  illegal_turn: "Nothing public (a six-video set in arXiv 2601.07845 is private). sps_malaysia_2021 is the closest. Added 2026-11-03: peshawar_roundabout_wrongturn (roundabout wrong-turn frames, CC BY 4.0)."
  illegal_u_turn: "sps_malaysia_2021 (dashcam, U-turn labels; access to be confirmed)."
  swerving: "meteor (zigzag, huge, dashcam) and zigzag_cadiz (only 4 tiny sequences)."
  red_light: "runningredlight_vn (best fit, manual Drive folder), idiap_traffic_junction, meteor (running signals). Added 2026-11-03: fluid_signalized_drone (drone video with signal timings and trajectories)."
  disregarding_signs: "Nothing found."
  signal_light: "tld_tail_lights (gated, 64 GB). DeepSignals is private."
  blocking_intersection: "Nothing found. Added 2026-11-03: fluid_signalized_drone (drone view of three signalized intersections)."
  crossing_solid_line: "Nothing found. Added 2026-11-03: road_lane_quality_dashcam plus the zone-rules substrates (nancy_multiperspective, avdl_latvia, road_anomaly_cctv, hanoi_motorbike_tracking)."
  overloading: "helmet_myanmar (a helmet class per rider position, so riders per motorcycle can be counted on fixed-camera clips), ridesafe_400 (triple riding, dashcam), dhaka_helmet_triple (images), triple_riding_rf (images). Added 2026-11-03: motorcycle_violation_hetero (keyframes, triple riding)."
  pickup_passengers: "Nothing public. The 2025 IEEE Access truck-passenger paper keeps its pictures confidential (traffic police data)."
  riding_outside_vehicle: "Nothing found."
  no_plate: "ridesafe_400 labels plates. Plate-only sets are already in training_lab/datasets (training, not testing)."
  no_helmet: "helmet_myanmar (FIXED roadside clips with tracked helmet labels: the best match), ridesafe_400 (dashcam), dhaka_helmet_triple (images), ai_city_helmet (registration). Added 2026-11-03: motorcycle_violation_hetero (keyframes, helmet and triple riding)."
  no_seatbelt: "seatbelt_rf (close-up images). No road-camera set found."
  distracted_driving: "In-cabin Kaggle sets (for example State Farm) need a Kaggle login and show the cabin, not a road camera."
  missing_side_mirror: "Nothing public (the 2025 arXiv paper 2511.12206 used its own data). Film your own."
  illegal_loading: "No public set (searched 2026-10-29: only commercial products and city violation tables, no video). Film your own: a bus or jeepney stopping in a marked no-loading area."
  truck_ban: "inatrc_toll_trucks (fixed-CCTV stills, trucks vs other vehicles: the detection half) and htv_highway (highway video, needs a Kaggle login; check by eye that trucks appear). The ban itself is a zone you draw."
  tricycle_on_highway: "No public video. Two Philippine Roboflow sets show tricycles and jeepneys (ph_vehicle_classification, philippine-traffic-detection) but only as detection pictures. Film your own. Added 2026-11-03: keke_counting (roadside frames with a tricycle class; no violation labels)."
  sidewalk_driving: "medellin_pedestrian_cctv (fixed CCTV frames of motorcycles with riders in pedestrian areas, the closest match; stills only)."
  double_parking: "No public set (only patents and violation tables). The i-LIDS parked-vehicle sets are for illegal parking in general. Film your own: a vehicle stopped beside a parked one while traffic passes."
