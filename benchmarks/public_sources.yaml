    caveat: "Frames, not mp4 (join them with ffmpeg to get a clip). The whole set is 28.9 GB in 7 zip parts; a plain run takes the annotations, the split list and the smallest part only (about 1.1 GB). No plates. Highways in Myanmar, mostly daylight."
    license: "CC BY 4.0 (OSF project licence). Cite: the HELMET dataset, OSF osf.io/4pwj8, and its paper Detecting motorcycle helmet use with deep learning, arXiv 1910.13232."
    page: https://osf.io/4pwj8/
