# Public clips / datasets that other studies used to test traffic-violation systems (research done 2026-10-29: each page was opened and read).
# Fetch them with:   python tools/benchmark/fetch_public_clips.py --list        (see the top of that script for every option)
#
# EVALUATION ONLY. Never train on these and keep them out of training_lab/datasets/, or the test stops being honest.
# Licences are mostly NON-COMMERCIAL: fine for a thesis, credit the authors, do not redistribute. Sizes and licences are read again
# from the host at run time (--dry-run shows them without downloading).
#
# Per source:  id, title, kind (video | images | mixed), camera, violations (keys of the 20), has, caveat, license, page,
#              host (http | hf | osf | mendeley | zenodo | figshare | kaggle | roboflow | manual), tier (small | medium | large | huge | manual),
#              ready (folder name under ready/: <origin>__<violations>), default (true = part of the lean core set a plain run downloads, with sample files only), + the host's own fields (see the script).
#
# Not every violation can be tested with public data. `--coverage` says which can, which can use ANY fixed-camera clip (a zone rule
# is defined by the zone you draw), and which need your own footage (benchmarks/CLIP_CHECKLIST.md).

sources:
  - id: idiap_traffic_junction
    ready: idiap-junction__red-light_pedestrian-lane_blocking-intersection
    title: "IDIAP Traffic Junction (Varadarajan and Odobez, 2009)"
    kind: video
    camera: "fixed junction camera, 360x288 at 25 fps, 44 minutes"
    violations: [red_light, pedestrian_lane, blocking_intersection]
    has: "One signalised junction. Annotated rare events: a vehicle stopping after the stop line, a car entering the pedestrian area, people crossing away from the zebra."
    caveat: "Old, low-resolution footage. The labels are 'abnormal event' labels, not our violation definitions."
    license: "Non-commercial research only. Cite: Varadarajan and Odobez, Topic Models for Scene Analysis and Abnormality Detection, ICCV-VS 2009."
    page: http://www.idiap.ch/~odobez/RESSOURCES/DataRelease-TrafficJunction.php
    host: http
    tier: small
    default: true
    files:
      - {name: traffic-junction.avi, url: "http://www.idiap.ch/~odobez/RESSOURCES/TRAFFIC-JUNCTION-DATA/traffic-junction.avi"}
      - {name: traffic-junction-sample.avi, url: "http://www.idiap.ch/~odobez/RESSOURCES/TRAFFIC-JUNCTION-DATA/traffic-junction-sample.avi"}
      - {name: Annotations.txt, url: "http://www.idiap.ch/~odobez/RESSOURCES/TRAFFIC-JUNCTION-DATA/Annotations.txt"}

